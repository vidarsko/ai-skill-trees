    selve treet ligger inne i den. Den henter ingenting, og virker derfor
    ved dobbeltklikk, uten nett og uten server.

    DET ER IKKE EN FINESSE, DET ER DET ENESTE SOM VIRKER. En side åpnet
    fra disk får opphavet `null` i nettleseren, og en side uten opphav får
    ikke lese filer ved siden av seg - `fetch()` blokkeres av CORS. En

    data, den kjører kode. Derfor kommer treet inn som `AIST_BUNDLE`
    nedenfor, altså som kode framfor som en fil som blir lest.

    KILDEFILA DI LIGGER I FILA. Regnearket står ordrett i AIST_BUNDLE
    under nøkkelen "tree.csv". Mister du CSV-en, kan du hente den ut
    derfra - denne fila er sin egen kilde.

    TILBAKELENKA ER FJERNET med vilje: dette treet ligger ikke i en

    Laget av byggeren på aiskilltrees.com/make-your-own/. Vil du endre
    treet, rediger regnearket og bygg en ny fil der; denne er med vilje

  <style>/*! AI Skill Trees engine · Copyright (c) 2026 Vidar Skogvoll · MIT License · https://github.com/vidarsko/ai-skill-trees */
/* ==========================================================================
   engine/tokens.css — the engine's DEFAULT palette and type.

   Why this file exists
   --------------------
   `tree.css` styles the graph entirely through custom properties, and until
   this file was written every one of them was defined by the website that
   happened to host it. The engine therefore could not render anywhere else:
   dropped into a folder on a teacher's laptop it came out unstyled, because
   `--paper`, `--ink`, `--primary` and the rest lived in the site's own
   `tokens.css`.

   This file inverts that. The engine now ships a complete, working palette,
   and a host site overrides whichever values it wants by loading its own
   token file AFTER this one. The values below are the ones aiskilltrees.com
   used when the engine was extracted, so nothing changed visually on that
   site — it simply stopped being the only place the engine works.

   Load order on a page that renders a tree:

       engine/tokens.css     <- defaults (this file)
       <host tokens, if any> <- optional overrides, later wins
       engine/tree.css       <- consumes the tokens

   Contrast: every pairing below was checked against its background at AA or
   better. If you override a colour, check it again — the graph puts small
   text on tinted fills in several places.
   ========================================================================== */

:root {
  /* ---- Surfaces and ink ------------------------------------------------- */
  --paper:         #F6F4EF;
  --paper-2:       #EDEAE2;
  --surface:       #FFFFFF;
  --ink:           #1A1D1B;
  --ink-3:         #646964;
  --ink-inverse:   #F6F4EF;

  /* ---- Rules and scrim -------------------------------------------------- */
  --rule:          rgba(26, 29, 27, 0.14);
  --rule-strong:   rgba(26, 29, 27, 0.30);
  --scrim:         rgba(26, 29, 27, 0.62);

  /* ---- Primary ---------------------------------------------------------- */
  --primary:        #1F6F4A;
  --primary-strong: #16543A;
  --primary-tint:   #E3EFE8;

  /* ---- Secondary accent, used for the "skill" node fill ----------------- */
  --amber:         #C8801F;
  --amber-tint:    #F7EBD9;

  /* ---- Third accent, used for the "fact" node fill ---------------------
     A clear mid blue; a darker, greyer blue read as a locked node. Blue beside
     orange is the pair most people with a colour-vision deficiency still
     tell apart; blue beside green is closer, so the fact fill is mixed
     stronger than the pale concept tint and differs in lightness too. */
  --blue:          #2563A8;   /* 6.12:1 against white */

  /* ---- Destructive ------------------------------------------------------ */
  --danger:        #C2362F;
  --danger-text:   #A32B24;
  --danger-tint:   rgba(194, 54, 47, 0.10);

  /* ---- Aid levels -------------------------------------------------------
     Read from JavaScript, not from tree.css: engine.js composes
     `var(--aid-N)` for the tag on a node, so these have to exist even
     though a search of the stylesheet will not find them.

     The colour is bound to the LEVEL, never to the subject: level 1 is
     always --aid-1. Five are defined and the sequence wraps, so a course
     with six levels reuses the first colour rather than falling back to
     nothing. They differ in hue rather than lightness, which is why the tag
     always carries a word as well — colour alone never carries meaning.
     Each is AA or better against white text. */
  --aid-1: #1F6F4A;   /* 6.12:1 */
  --aid-2: #8A5A12;   /* 5.91:1 */
  --aid-3: #1F5F7A;   /* 7.06:1 */
  --aid-4: #5B3D8A;   /* 8.47:1 */
  --aid-5: #8A2B4A;   /* 9.30:1 */

  /* ---- Elevation --------------------------------------------------------
     A deliberate, narrow exception to a flat design: the floating toolbar
     and the modals sit above a scrolling canvas and need real height. */
  --shadow-float: 0 4px 14px rgba(26, 29, 27, 0.18);
  --shadow-modal: 0 12px 40px rgba(26, 29, 27, 0.28);

  /* ---- Type -------------------------------------------------------------
     A stack of system faces, so the engine has no webfont dependency and
     works offline from a folder. A host site that wants its own face
     overrides this one line. */
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

  /* The choices a tree can make with a `style.font` row. engine.js points
     --font-sans at one of these; the names are the values the row takes.
     Every stack is system faces only, for the reason above: the single-file
     edition has to look the same on a laptop with no network. */
  --font-system:   system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-humanist: Seravek, "Gill Sans Nova", Ubuntu, Calibri, "DejaVu Sans", source-sans-pro, sans-serif;
  --font-rounded:  ui-rounded, "Hiragino Maru Gothic ProN", Quicksand, Comfortaa, Manjari, "Arial Rounded MT", "Arial Rounded MT Bold", Calibri, source-sans-pro, sans-serif;
  --font-serif:    Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --font-mono:     ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}

/* ==========================================================================
   tokens.css — the single source of truth for color, type and spacing.
   Design system: aiskilltrees-style v1.3
   (canonical: ../../AgentSkills/ui-style-banded-fullbleed/SKILL.md in the work vault)

   NO other stylesheet and NO page may hardcode a hex value or a font stack.
   If a value is missing, add a token here — that is what keeps the palette
   one variable to change rather than a find-and-replace across the site.
   ========================================================================== */

@import url("fonts.css");   /* self-hosted since 2026-09-26 — see css/fonts.css */

:root {
  /* ---- Grounds ---------------------------------------------------------- */
  --paper:         #F6F4EF;   /* default page ground — warm off-white */
  --paper-2:       #EDEAE2;   /* alternate band, one step deeper */
  --surface:       #FFFFFF;   /* cards, tables, the graph canvas */

  /* ---- Ink -------------------------------------------------------------- */
  --ink:           #1A1D1B;   /* primary text, and the dark band ground — 15.5:1 on --paper */
  --ink-2:         #4A4F4B;   /* secondary text — 7.6:1 on --paper */
  --ink-3:         #646964;   /* muted: captions, metadata — 5.1:1 on --paper */
  --ink-inverse:   #F6F4EF;   /* text on --ink and --primary bands */
  --rule:          rgba(26, 29, 27, 0.14);   /* hairline separators inside a band */
  --rule-inverse:  rgba(246, 244, 239, 0.22);

  /* ---- Primary ---------------------------------------------------------- */
  --primary:        #1F6F4A;  /* deep evergreen — 6.1:1 on white, 5.6:1 on --paper */
  --primary-strong: #16543A;  /* hover/active — 8.9:1 on white */
  --primary-tint:   #E3EFE8;  /* pale band fill */

  /* ---- Signal (graph states; emphasis used sparingly) ------------------- */
  --amber:         #C8801F;   /* fills and marks only — 5.3:1 against --ink */
  --amber-text:    #8A5A12;   /* the same signal as words — 5.4:1 on --paper */
  --amber-tint:    #F7EBD9;
  --blue:          #2563A8;   /* fact nodes — 6.12:1 against white */

  /* ---- Rules and elevation ----------------------------------------------
     --rule-strong is the hairline at hover/active strength.
     The two shadows exist ONLY for the skill-tree app: its floating toolbar
     and its modals sit above a scrolling graph canvas and need real
     elevation. The design system's "no shadows" rule is about cards on a
     band ground and still holds everywhere else — do not reach for these on
     a marketing page. */
  --rule-strong:   rgba(26, 29, 27, 0.30);
  --shadow-float:  0 4px 14px rgba(26, 29, 27, 0.18);
  --shadow-modal:  0 12px 40px rgba(26, 29, 27, 0.28);

  /* ---- Danger ------------------------------------------------------------
     Validation errors in the skill-tree app (a malformed CSV, a cycle in the
     graph). --danger is the fill/rule; --danger-text is the same signal as
     words — 5.9:1 on --paper. */
  --danger:        #C2362F;
  --danger-text:   #A32B24;
  --danger-tint:   rgba(194, 54, 47, 0.10);


  /* ---- Aid levels --------------------------------------------------------
     An ORDERED palette for the `aids` column. A subject picks LEVELS, never
     colours: level 1 always gets --aid-1, level 2 --aid-2, and so on. That is
     what keeps a Norwegian «Del 1» and an IB «Paper 1» the same colour, and
     what keeps hex values out of a tree's own files.

     Levels 1 and 2 are deliberately the old --del1/--del2 values, so the 2P
     tree looks exactly as it did.

     All five carry WHITE text at AA for small text (measured, not guessed):
     6.12, 5.91, 7.06, 8.47 and 9.30 : 1. They separate by HUE, not by
     luminance — which is safe here only because an aid tag always carries its
     label in words. Never ship a wordless aid tag. */
  --aid-1: #1F6F4A;   /* evergreen — 6.12:1 on white */
  --aid-2: #8A5A12;   /* amber-brown — 5.91:1 */
  --aid-3: #2A5C86;   /* deep blue — 7.06:1 */
  --aid-4: #6E3A6B;   /* plum — 8.47:1 */
  --aid-5: #7A2E2E;   /* brick — 9.30:1 */

  /* ---- Subject colours ---------------------------------------------------
     Used by /gy25/ (and any later per-curriculum page) to colour a subject's
     level buttons when a tree exists for it. Vidar's choice 2026-10-05:
     mathematics blue, physics red, biology green; the rest picked here.
     Overlap between subjects is accepted. All carry WHITE text at AA
     (≥ 4.5:1), and a button always carries its level in words, so colour
     never carries the meaning alone — a greyed level is also disabled and
     says so to a screen reader. */
  --subject-mathematics: #2563A8;   /* blue — 6.12:1 on white (same as --blue) */
  --subject-physics:     #B3261E;   /* red — 6.5:1 */
  --subject-biology:     #1F6F4A;   /* green — 6.12:1 (same as --primary) */
  --subject-chemistry:   #8A5A12;   /* amber-brown — 5.91:1 */
  --subject-science:     #0F6B73;   /* teal — 6.2:1 */
  --subject-language:    #6E3A6B;   /* plum — 8.47:1 */
  --subject-social:      #7A2E2E;   /* brick — 9.30:1 */
  --subject-practical:   #475569;   /* slate — 7.58:1, praktiske og estetiske fag (2026-10-08) */
  --subject-none:        #E2DFD7;   /* greyed level: no tree yet — with --ink-2 text, 6.3:1 */

  /* ---- Department colours — /matnat/ ------------------------------------
     One per unit at the MN faculty, UiO. Vidar's choice 2026-11-09: physics
     red, mathematics blue, chemistry yellow, geosciences brown, informatics
     green; the rest picked here. Contrast is with --ink-inverse text, except
     chemistry, whose yellow carries --ink text instead (8.7:1). */
  --dept-fys:      #B3261E;   /* red — 5.95:1 (same as --subject-physics) */
  --dept-math:     #2563A8;   /* blue — 5.57:1 (same as --subject-mathematics) */
  --dept-kjemi:    #E9B10A;   /* yellow — dark text */
  --dept-geofag:   #7A4A22;   /* brown — 6.75:1 */
  --dept-ifi:      #1F7A3A;   /* green — 4.89:1 */
  --dept-ibv:      #0F6B73;   /* teal — 5.67:1 */
  --dept-farmasi:  #6E3A6B;   /* plum — 7.7:1 */
  --dept-astro:    #3730A3;   /* indigo — 9.04:1 */
  --dept-its:      #475569;   /* slate — 6.89:1 */
  --dept-mn:       #C2410C;   /* orange — 4.71:1 */
  --dept-natfag:   #BE185D;   /* pink — 5.49:1 */
  --dept-sfe:      #3F6212;   /* olive — 6.4:1 */

  /* ---- Scrim ------------------------------------------------------------
     A FLAT overlay, not a gradient: the system has no gradients, and a
     photograph still has to be dimmed before display type can sit on it. */
  --scrim:         rgba(26, 29, 27, 0.62);

  /* ---- Type ------------------------------------------------------------- */
  --font-sans:  "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --font-serif: "Charis SIL", "Source Serif 4", Georgia, serif;

  --step-xs:  0.875rem;                                       /* 14px — captions, metadata */
  --step-s:   1rem;                                           /* 16px — UI, labels */
  --step-m:   clamp(1.0625rem, 0.5vw + 0.95rem, 1.1875rem);   /* 17→19px — body prose */
  --step-l:   clamp(1.375rem, 1vw + 1.1rem, 1.75rem);         /* 22→28px — h3 */
  --step-xl:  clamp(1.75rem, 2vw + 1.25rem, 2.5rem);          /* 28→40px — h2 */
  --step-2xl: clamp(2.25rem, 4.5vw + 1rem, 3.75rem);          /* 36→60px — h1 */
  --step-3xl: clamp(2.75rem, 7vw + 0.5rem, 5.5rem);           /* 44→88px — hero only */

  /* ---- Spacing and measures -------------------------------------------- */
  --gutter:        clamp(1.25rem, 5vw, 4rem);   /* 20px phone → 64px desktop, INSIDE bands */
  --space-band:    clamp(3rem, 8vw, 7rem);      /* vertical padding of a band */
  --space-band-lg: clamp(4.5rem, 12vw, 10rem);  /* hero and closing CTA only */
  --measure-prose: 68ch;
  --measure-wide:  1280px;

  --space-1: 0.5rem;
  --space-2: 1rem;
  --space-3: 1.5rem;
  --space-4: 2rem;
  --space-5: 3rem;
  --space-6: 4rem;
}

/*! AI Skill Trees engine · Copyright (c) 2026 Vidar Skogvoll · MIT License · https://github.com/vidarsko/ai-skill-trees */
/* ==========================================================================
   tree.css — the skill-tree graph app (the view at /trees/<slug>/).

   PORTED from skogvoll.com's ferdighetstre/style.css, 2026-09-19. Everything
   below the bridge is that file verbatim: the layout, the detail panel, the
   floating toolbar and every tuning comment in it are the result of a lot of
   iteration and are NOT to be re-derived here. What changed on the way over is
   this header, and the override block at the very BOTTOM of the file.

   The bridge below re-expresses the names that file uses (--bg, --accent,
   --text, --radius ...) in terms of aiskilltrees-style tokens, so the app
   inherits this site's palette without touching 1000 lines of tuned CSS. If a
   value looks wrong on this site, fix it HERE, in the bridge — or, when a
   single rule rather than a color needs to change, in the override block at
   the bottom. Editing a rule in the body would make the two copies diverge
   for no reason, and makes the next port harder than it needs to be.

   The page loads tokens.css and then this file, and NOT base.css: base.css
   carries the band model and prose defaults for the marketing pages, which
   would fight the app's own layout. That means the small reset below has to
   live here.

   Design system: aiskilltrees-style v1.0. No hardcoded hex values, no font
   stacks — every color below resolves to a token in tokens.css.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ---- Bridge: engine token name → aiskilltrees token --------------------- */
  --bg:            var(--paper);
  --surface-hover: var(--paper-2);
  --border:        var(--rule);
  --border-strong: var(--rule-strong);
  --text:          var(--ink);
  --text-muted:    var(--ink-3);
  --accent:        var(--primary);

  /* The source system used a gradient here. aiskilltrees-style has no
     gradients at all, so the "gradient" is a flat primary fill. */
  --accent-grad:   var(--primary);

  /* "Mastered" in the graph is the primary green, per the design system's
     note on the skill-tree graph. State is never carried by color alone —
     a mastered node also gets an inset ring and a checked box. */
  --success:       var(--primary);
  --danger-soft:   var(--danger-text);

  /* Square corners are the system's rule. --radius-pill stays round: it is
     only used on circular icon buttons (zoom, menu, help), which are controls,
     not page-level containers. */
  --radius:        0;
  --radius-sm:     0;
  --radius-pill:   9999px;

  /* ---- Node types --------------------------------------------------------
     Begrep (a concept) is green and ferdighet (a skill) is orange, and the
     two are also told apart by the label on the node itself, never by fill
     alone. Both fills are opaque, so the edge lines behind a node never read
     through the card. The skill fill is 40% amber rather than the pale
     --amber-tint: at the tint it read as beige beside the green, and the two
     types stopped looking like two colours (Vidar, 2026-09-26). */
  --begrep-bg:        var(--primary-tint);
  --begrep-border:    color-mix(in srgb, var(--primary) 55%, transparent);

  --ferdighet-bg:     color-mix(in srgb, var(--amber) 40%, var(--surface));
  --ferdighet-border: var(--amber);

  /* Fakta (a fact node, from 0.21.0) is blue: a third hue, and a fill
     between the two others in strength, so it differs from the pale green
     in lightness as well as in hue. */
  --fakta-bg:         color-mix(in srgb, var(--blue) 24%, var(--surface));
  --fakta-border:     var(--blue);

  --locked-opacity: 0.45;

  --column-alt: color-mix(in srgb, var(--ink) 4%, transparent);

}

body { font-family: var(--font-sans); }


html, body { height: 100%; }

a { color: var(--accent); }

/* Den opprinnelige <header> er tømt av ensureActionMenu() (se engine.js) -
   ALT innholdet dens (tilbake-lenke, dag/natt-knapp, fremdriftslinje,
   tittel, undertekst) flyttes inn i #action-menu-panel, slik at grafen kan
   fylle hele skjermhøyden. Skjules derfor unconditionally her i CSS (ikke
   bare via JS) for å unngå et glimt av den gamle headeren før JS rekker å
   flytte innholdet. */
header {
  display: none;
}

/* The source page had a light/dark toggle. aiskilltrees-style has no dark
   mode in v1 and this page ships no toggle button, so those rules are gone.
   engine.js looks the button up with querySelector and tolerates its
   absence (see ensureActionMenu), so nothing else had to change. */

.back-link {
  display: inline-block;
  font-size: 0.85rem;
  color: var(--text-muted);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s, color 0.2s;
}

.back-link:hover, .back-link:focus-visible {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* Meny-knapp nederst til venstre, til venstre for zoom-knappene i
   #bottom-toolbar (se setupZoom/getBottomToolbar i engine.js) - IKKE øverst
   til høyre, siden den da nesten overlappet tilbake-knappen i detaljpanelet
   når det er åpent på mobil (begge endte i samme hjørne). Slår ut
   #action-menu-panel, som ensureActionMenu() (engine.js) fyller med ALT som
   før lå i headeren: tilbake-lenke + dag/natt-knapp (#menu-nav-row),
   fremdriftslinje, tittel/undertekst, og til slutt de sjeldnere brukte
   knappene (læringsmål-liste, prøvegenerator, motivasjon). Selve #menu-wrap
   er bare et ankerpunkt for panelet - #bottom-toolbar (fixed) gir selve den
   flytende posisjoneringen.

   Fra 2026-09-20 ligger OGSÅ «?»-knappen og «Om faget» inne i panelet.
   Verktøylinjen har da bare burgeren og zoom-kontrollene, og burgeren er
   gjort litt større enn dem: den åpner alt det andre, så den skal lese som
   hovedknappen framfor som én av fire like. */
#menu-wrap {
  position: relative;
}

/* Bevisst større enn zoom-knappene (2,6rem) og svakt grønn: dette er
   inngangen til alt annet på sida, og den eneste knappen en ny bruker MÅ
   finne. Tinten er --primary-tint, systemets bleke grønn — nok til å skille
   den fra de nøytrale zoom-knappene, ikke nok til å lese som en CTA. */
#menu-toggle-btn {
  width: 3.5rem;
  height: 3.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-pill);
  border: 1px solid color-mix(in srgb, var(--primary) 28%, transparent);
  background: var(--primary-tint);
  color: var(--primary-strong);
  cursor: pointer;
  box-shadow: var(--shadow-float);
  transition: background 0.15s ease, border-color 0.15s ease;
}

#menu-toggle-btn svg { width: 24px; height: 24px; }

#menu-toggle-btn:hover, #menu-toggle-btn[aria-expanded="true"] {
  border-color: color-mix(in srgb, var(--primary) 55%, transparent);
  background: color-mix(in srgb, var(--primary) 16%, var(--surface));
}

#action-menu-panel {
  display: none;
  flex-direction: column;
  gap: 0.6rem;
  position: absolute;
  bottom: calc(100% + 0.5rem);
  left: 0;
  z-index: 30;
  width: min(320px, calc(100vw - 2.4rem));
  max-height: calc(100vh - 5rem);
  overflow-y: auto;
  padding: 0.8rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-modal);
}

#action-menu-panel.open { display: flex; }

#menu-nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.8rem;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--border);
}

#action-menu-panel h1 {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

#action-menu-panel p.tagline {
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 0.85rem;
  line-height: 1.5;
}

#action-menu-panel #motivation-btn,
#action-menu-panel #goal-index-btn,
#action-menu-panel #lesson-planner-btn,
#action-menu-panel #search-btn,
#action-menu-panel #resources-btn,
#action-menu-panel #course-info-btn,
#action-menu-panel #help-btn,
#action-menu-panel #download-btn,
#action-menu-panel #edit-link {
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  padding: 0.55rem 0.9rem;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  width: 100%;
  text-align: left;
  white-space: normal;
  transition: background 0.15s ease, border-color 0.15s ease;
}

#action-menu-panel #motivation-btn:hover,
#action-menu-panel #goal-index-btn:hover,
#action-menu-panel #lesson-planner-btn:hover,
#action-menu-panel #search-btn:hover,
#action-menu-panel #resources-btn:hover,
#action-menu-panel #course-info-btn:hover,
#action-menu-panel #help-btn:hover,
#action-menu-panel #download-btn:hover,
#action-menu-panel #edit-link:hover {
  border-color: var(--border-strong);
  background: var(--surface-hover);
}

/* Enkeltfil-utgaven tar et par sekunder å sette sammen. Knappen sier det
   med teksten sin; dette er bare for at den ikke skal se trykkbar ut imens. */
#action-menu-panel #download-btn[disabled] {
  opacity: 0.6;
  cursor: progress;
}

/* Lenken til redigeringsverktøyet ser ut som knappene over den. */
#action-menu-panel #edit-link {
  display: block;
  box-sizing: border-box;
  text-decoration: none;
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--border);
}

.progress-bar {
  flex: 1;
  max-width: 420px;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--accent-grad);
  width: 0%;
  transition: width 0.3s ease;
}

.progress-label {
  font-size: 0.82rem;
  color: var(--text-muted);
  white-space: nowrap;
}

#error-banner {
  display: none;
  background: var(--danger-tint);
  border-bottom: 1px solid var(--danger);
  color: var(--danger-soft);
  font-size: 0.85rem;
  padding: 0.8rem 2rem;
  white-space: pre-wrap;
}

#error-banner.visible { display: block; }

/* Øverste linje: fagnavnet, og veien videre for den som vil lage sitt eget.
   Den ligger i flex-kolonnen FØR <main>, så grafen mister nøyaktig høyden
   linja tar og ingenting legger seg oppå noe annet. Venstremargen er den
   samme som #graph-scroll har, slik at teksten står rett over den første
   kolonneoverskriften. Størrelsen er kolonneoverskriftens, men uten
   versalene og sperringen: dette er en setning, ikke en etikett. */
.made-with {
  flex: 0 0 auto;
  margin: 0;
  /* line-height: 1 fjerner den halve linjeavstanden som ellers ligger under
     teksten. De 5px ned til første emneoverskrift lages IKKE her: se
     #graph-container, som trekker lerretet opp inne i rullefeltet i
     stedet. Linja skal beholde hele sin egen høyde, ellers rulles grafen
     opp i teksten. */
  padding: 0.5rem 2rem 0;
  font-size: 0.7rem;
  line-height: 1;
  color: var(--text-muted);
}

/* Fagnavnet er det eneste som skal stikke seg ut: det sier hvilket tre dette
   er. Resten av linja er en invitasjon, og den kan ligge stille. */
.made-with strong {
  font-weight: 600;
  color: var(--text);
}

.made-with a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid transparent;
}

.made-with a:hover,
.made-with a:focus-visible {
  border-bottom-color: var(--accent);
}

/* «⚠ Sikkerhet» sist i linja. Rød, fordi den skal ses før man tar treet i
   bruk; en knapp og ikke en lenke, fordi den åpner et vindu på sida. */
.made-with__safety {
  display: inline;
  padding: 0;
  border: 0;
  border-bottom: 1px solid transparent;
  background: none;
  font: inherit;
  font-weight: 600;
  line-height: inherit;
  color: var(--danger-text);
  cursor: pointer;
}
.made-with__safety:hover,
.made-with__safety:focus-visible {
  border-bottom-color: var(--danger-text);
}
.warning-icon {
  width: 1.1em;
  height: 1.1em;
  margin-right: 0.25em;
  vertical-align: -0.2em;
}

main {
  flex: 1;
  display: flex;
  min-height: 0;
  width: 100%;
}

#graph-scroll {
  flex: 1;
  min-width: 0;
  overflow: auto;
  /* Ingen padding-top: over grafen står .made-with, som holder den klar av
     skjermkanten, og avstanden derfra ned til første kolonneoverskrift er
     LAYOUT.padding i selve layout-algoritmen (se
     computeGlobalRowStarts/layoutColumn). To luftrom oppå hverandre ble
     synlig for mye. */
  padding: 0 2rem 2.4rem;
  position: relative;
  cursor: grab;
}

#graph-scroll.panning {
  cursor: grabbing;
  user-select: none;
}

/* margin-top: 5px ned til første emneoverskrift, og regnestykket er dette:
   lerretet har 12px egen luft (LAYOUT.padding) som gjelder alle fire sidene
   og ikke skal krympes for å rette én av dem, så lerretet trekkes 7px opp
   INNE i rullefeltet. De 7px lå til 21.09 som negativ bunnmarg på
   .made-with, og det var feil sted: da startet #graph-scroll 7px inne i
   toppteksten, og nodekortene rullet opp over de nederste 7px av bokstavene
   i stedet for å stoppe under dem. Her er det bare tomrommet øverst i
   lerretet som beskjæres, og teksten står i fred. */
#graph-container {
  position: relative;
  margin: -7px auto 0;
  transform-origin: 0 0;
}

/* Flytende verktøylinje for zoom - eneste innhold igjen i bottom-toolbar
   etter at "vis alle læringsmål" og prøvegeneratoren flyttet inn i
   #action-menu-panel (se ensureActionMenu i engine.js). Disse knappene
   brukes aktivt mens man utforsker kartet, så de forblir synlige i stedet
   for gjemt bak et trekkspill. */
#bottom-toolbar {
  position: fixed;
  left: 1.6rem;
  bottom: 1.6rem;
  z-index: 15;
  display: flex;
  align-items: center;
  gap: 0.7rem;
}

#zoom-controls {
  display: flex;
  align-items: stretch;
  gap: 0.5rem;
}

/* Ikon-only knapper (+/−/⤢), ingen tekst - holder knappene små også på
   mobil, se prosjektnotat om at knappene var for store der. */
#zoom-in-btn, #zoom-out-btn, #fit-view-btn {
  width: 2.6rem;
  height: 2.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  box-shadow: var(--shadow-float);
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}

#zoom-in-btn:hover, #zoom-out-btn:hover, #fit-view-btn:hover {
  border-color: var(--border-strong);
  background: var(--surface-hover);
  transform: translateY(-1px);
}

/* Prøvegenerator-widget - nå inne i #action-menu-panel, se der for
   panel-spesifikk styling av knappen selv. */
#exam-widget {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
  font-size: 0.82rem;
}

#exam-count-label {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--text-muted);
  white-space: nowrap;
}

#exam-count {
  width: 3.2rem;
  font-size: 0.82rem;
  padding: 0.3rem 0.4rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
}

#action-menu-panel #exam-btn {
  flex: 1 1 auto;
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  padding: 0.55rem 0.9rem;
  border-radius: var(--radius-pill);
  border: none;
  background: var(--accent-grad);
  color: var(--ink-inverse);
  cursor: pointer;
  white-space: normal;
  transition: transform 0.15s ease, opacity 0.15s ease;
}

#action-menu-panel #exam-btn:hover {
  transform: translateY(-1px);
  opacity: 0.92;
}

@media (max-width: 720px) {
  #bottom-toolbar { left: 1rem; bottom: 1rem; }
}

.goal-index-section { margin-bottom: 1.4rem; }

.goal-index-section h3 {

/* ✓/✕ for hele lista, under innledningen. */

#goal-index-intro {

/* Én rad per læringsmål: avkryssing til venstre (mestret, eller utvalg til
   økta i undervisningsplanleggeren), navn + status til høyre. De to er bevisst visuelt forskjellige - status
   er ren lesbar informasjon (mestret/klar/mangler), mens avkryssinga er det

.goal-index-item-status {

#lesson-minutes,

#lesson-plan-btn {

/* --------------------------------------------------------------------------
   Aid tag.

   Replaces the old .badge-del1/.badge-del2/.badge-begge trio, which hardcoded
   a two-level Norwegian exam split into CSS class names. Levels are now open
   ended: the colour comes from --aid-N in tokens.css, chosen by LEVEL, and is
   set inline by makeAidsTag() in engine.js — that is the one place a `style`
   attribute is legitimate here, because the level count is data.

   A tag ALWAYS carries its label in words ("Del 1", "Del 1+2"). The --aid-*
   colours separate by hue rather than luminance, so the text is what carries
   the meaning; a wordless tag would be colour-only. See tokens.css.

   It is a <button>: clicking it opens the detail panel at the aids section,
   which is the only place a student can read what the level actually allows.

.aidtag {
  display: inline-flex;
  align-items: center;
  padding: 0.1rem 0.45rem;
  border: 0;
  border-radius: 0;
  color: var(--surface);
  font-family: inherit;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1.5;
  white-space: nowrap;
  cursor: pointer;
}
.aidtag:hover { filter: brightness(1.12); }
.aidtag:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* A split tag is the same size as a single one — that is the whole point of
   splitting rather than stacking two tags. The text sits on top of both
   stripes, so it needs a shadow to stay readable across the seam. */
.aidtag--split { text-shadow: 0 0 2px rgba(26, 29, 27, 0.55); }

/* In the detail panel the tag is a label, not a control. */
.aidtag--static { cursor: default; }
.aidtag--static:hover { filter: none; }



.badge-type {
  font-size: 0.68rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;

/* ==========================================================================
   SITE-SPECIFIC OVERRIDES — must stay last in the file.

   Everything above this line is the ported source, unchanged. Rules that
   aiskilltrees-style actually contradicts go here instead of being edited
   in place, so the two copies stay easy to diff.

   They have to be LAST: the rules they overrule have the same specificity,
   so only source order decides. Put this block at the top and it silently
   does nothing.
   ========================================================================== */

/* BUTTONS ARE ROUNDED IN THE TREE APP — a deliberate departure from
   aiskilltrees-style, decided by Vidar 2026-09-20.

   The port originally squared every text button to match the design system,
   which left #goal-index-btn and #exam-btn square while the icon controls
   next to them stayed pills — an inconsistency visible in the same menu.
   Rather than square the pills too, the whole app goes round.

   The rule is now: in the tree app, CONTROLS are pills and CONTAINERS
   (modals, panels, the node boxes) stay square, so --radius is still 0.
   The marketing pages are untouched and remain square throughout. */
.btn,
#action-menu-panel #goal-index-btn,
#action-menu-panel #lesson-planner-btn,
#action-menu-panel #exam-btn,
#lesson-plan-btn,
.linkbtn,
.column-header-btn {
  border-radius: var(--radius-pill);
}

/* Læringsmålnavnet i «Vis alle læringsmål» er en knapp (den hopper til noden
   i kartet), men skal lese som tekst. Se renderGoalIndexBody i engine.js. */
button.goal-index-item-name {
  border: 0;
  background: none;
  padding: 0;
  margin: 0;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
button.goal-index-item-name:hover { color: var(--accent); text-decoration: underline; }
button.goal-index-item-name:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* THE APP FILLS THE VIEWPORT — <body> HAS TO BE THE FLEX COLUMN.

   `main` asks for `flex: 1; min-height: 0`, which only means something inside a
   flex container, and nothing ever made <body> one. So `main` took its content
   height instead: #graph-scroll grew to the full height of the graph (2600px+
   on a 900px screen), the WINDOW scrolled vertically, and the scroll container
   itself had no vertical range at all — scrollHeight === clientHeight.

   That is what made drag-to-pan work sideways and do nothing downwards.
   setupPanning() in engine.js sets scrollLeft AND scrollTop on every move; the
   horizontal one had somewhere to go and the vertical one did not. Same reason
   the mouse wheel scrolled the page rather than the map.

   Missing in the skogvoll.com original too, so this is a fix, not a port
   artefact to keep. `height: 100%` on html+body near the top of this file is
   what gives the column a definite height to divide up; `overflow: hidden`
   keeps a stray child from bringing the page scrollbar back. The detail panel
   scrolls itself (#detail-panel-inner is overflow-y: auto), so nothing inside
   depends on the page scrolling. */
body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* LEDETEKSTEN OVER BESKRIVELSEN — «Eleven kan:» / «Eleven kan forklare:».

   Beskrivelsen i tree.csv er fra 2026-09-21 en bar verbfrase (ferdighet)
   eller en bar definisjon (begrep); setningen fullføres her. Ledeteksten er
   derfor ikke pynt, den er halve setningen, og den står i primærgrønt på
   egen linje for å vise at den kommer fra verktøyet og ikke fra læreren som
   skrev noden. Se learnerLeadIn() i engine.js. */
#detail-lead {
  margin-bottom: 0.3rem;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--accent);
}

/* #detail-desc er et <div> fra samme dato, fordi en node kan holde flere
   definisjoner. Avsnittsmargen slås av her; avstanden ned til
   forutsetningene er elementets egen margin-bottom lenger opp i fila. */
#detail-desc > p { margin: 0; }

#detail-desc .definition-list {
  margin: 0;
  padding-left: 1.15rem;
}

#detail-desc .definition-list li { margin-bottom: 0.4rem; }
#detail-desc .definition-list li:last-child { margin-bottom: 0; }
/* Termen står i samme farge som brødteksten ellers, bare i halvfeit: den
   skal skille seg fra definisjonen, ikke fra siden. Gjelder både avsnittet
   med én definisjon og punktlista med flere. */
#detail-desc strong { color: var(--text); }


/* KANTENE ER SVAKE SOM STANDARD - tre nivåer, ikke ett.

   Et tre med hundre noder tegner flere hundre kurver, og i full styrke legger
   de seg som et garnnøste over kolonnene (Vidar, 2026-09-21). Grunnfargen er
   derfor lys nok til at strukturen anes uten å konkurrere med boksene, og to
   tilstander henter en kant tilbake:

     .edge-from-mastered  kanten GÅR FRA en node eleven har huket av. Det er
                          kantene som peker videre inn i det eleven kan ta fatt
                          på nå, så de er de eneste som er verdt å lese i en
                          graf man ikke har valgt noe i.
     .edge-selected       kanten hører til noden som er åpen i detaljpanelet,
                          inn eller ut. Denne er grønn - den svarer på «hva
                          henger sammen med DENNE?», som er et annet spørsmål
                          enn «hvor er jeg», og skal kunne følges på tvers av
                          hele kartet.

   Grønn er aldri det eneste signalet: den valgte noden har også .active, og en
   avhuket node har sin egen ring og avkryssede boks. Se updateEdgeHighlight()
   i engine.js, som også flytter de valgte kantene sist i <svg> så de tegnes
   øverst. Erstatter .edge-active, som lyste opp kanter der BEGGE endene var
   mestret - en tilstand eleven ikke har bruk for å se. */
#edges path {
  stroke: color-mix(in srgb, var(--ink) 25%, transparent);
  stroke-width: 1.3;
}

#edges path.edge-from-mastered {
  stroke: color-mix(in srgb, var(--ink) 40%, transparent);
  stroke-width: 1.7;
}

/* Kanter mellom emner: i hvile bare stubbene, når en av nodene er åpen bare
   hele kanten (se edgeStub i engine.js). */
#edges path.edge-cross:not(.edge-selected),
#edges path.edge-stub.edge-selected {
  display: none;
}

#edges path.edge-stub {
  stroke: color-mix(in srgb, var(--ink) 40%, transparent);
  stroke-linecap: round;
  stroke-linejoin: round;
}

#edges path.edge-stub.edge-from-mastered {
  stroke: color-mix(in srgb, var(--ink) 55%, transparent);
}

#edges path.edge-selected {
  stroke: color-mix(in srgb, var(--accent) 85%, transparent);
  stroke-width: 2.4;
}
</style>

    engine.js tømmer denne <header>-en og flytter alt innholdet (tilbakelenke,

  <script>window.AIST_BUNDLE = {"tree.csv":"id,type,topic,name,description,depends_on,aids,instruction\n,config,,schemaVersion,3,,,\n,config,,topicOrder,Utforsking og naturvitenskapelig metode,,,\n,config,,title,Naturfag 8.–10. trinn,,,\n,config,,description,\"Utforsking, modeller og programmering, teknologi, stoffer og kjemiske reaksjoner, energi og klima, celler, økologi, evolusjon og jordas historie, og kropp og helse på ungdomstrinnet — dekomponert i det elevene faktisk må kunne gjøre.\",,,\n,config,,language,nb,,,\n,config,,subjectFamily,natural-sciences,,,\n,config,,storageKey,no-grunnskole-naturfag-ferdighetstre-fullfort,,,\n,config,,features.motivation,false,,,\n,config,,slots.courseName,\"naturfag 8.–10. trinn (norsk ungdomsskole, NAT0021)\",,,\n,config,,slots.expressionFocus,\"blander sammen vær og klima, fotosyntese og celleånding, eller atom og molekyl; sier at energi «brukes opp» eller «forsvinner» der den egentlig omdannes; sier at antibiotika virker mot virus; bruker «teori» i dagligtale-betydningen «løs gjetning»; eller trekker en årsakssammenheng fra data som bare viser en sammenheng\",,,\n,config,,slots.courseSpecifics,\"Faget har standpunktkarakter på 10. trinn og ingen skriftlig eksamen. Eleven kan trekkes ut til muntlig-praktisk eksamen med forberedelsesdel, laget og sensurert lokalt, der eleven gjerne viser et forsøk, en modell, et program eller egne data og forklarer det muntlig med fagbegreper.\",,,\n,config,,decompositionVersion,2.12.2,,,\n,config,,author,Vidar Skogvoll,,,\n,config,,authorUrl,https://skogvoll.com,,,\n,config,,license,CC BY 4.0,,,\n,config,,subtitle,\"Ungdomstrinnet, 8.–10. trinn\",,,\n,config,,curriculum,LK20,,,\n,config,,courseCode,NAT0021,,,\n,config,,country,NO,,,\n,config,,institution,grunnskole,,,\n,config,,division,8-10,,,\n,config,,subjectArea,science,,,\n,config,,keywords,naturfag; ungdomsskole; ungdomstrinnet; 10. trinn; muntlig-praktisk eksamen; forsøk; hypotese; programmering; periodesystemet; kjemiske reaksjoner; energi; drivhuseffekten; celler; økosystem; evolusjon; platetektonikk; immunforsvar; vaksiner,,,\n,config,,updated,2026-10-12,,,\nhypotese,concept,Utforsking og naturvitenskapelig metode,Hypotese,\"Hypotese: en mulig forklaring eller et foreløpig svar på et spørsmål, formulert slik at et forsøk eller en observasjon kan vise om den stemmer.\",,0,\nvariabler,concept,Utforsking og naturvitenskapelig metode,\"Uavhengig, avhengig og kontrollvariabel\",\"Uavhengig variabel: det du selv endrer i forsøket.\nAvhengig variabel: det du måler, og som kanskje endrer seg fordi du endret den uavhengige.\nKontrollvariabel: det du holder likt hele tiden, slik at bare den uavhengige variabelen kan forklare resultatet.\",,0,\nformulere-hypotese,skill,Utforsking og naturvitenskapelig metode,Formulere et undersøkbart spørsmål og en hypotese,\"stille et spørsmål om et naturfaglig fenomen som kan undersøkes, og formulere en hypotese som et forsøk kan bekrefte eller avkrefte.\",hypotese,0,\"Gi eleven en hverdagsobservasjon (f.eks. at isbiter smelter fortere i én kopp enn i en annen, eller at en plante i vinduet vokser skjevt), og be dem formulere et spørsmål som kan undersøkes og en hypotese, og si hvilket resultat som ville vist at hypotesen er feil.\"\nplanlegge-forsok,skill,Utforsking og naturvitenskapelig metode,Planlegge et forsøk som endrer én ting om gangen,\"planlegge et forsøk for å teste en hypotese, med én uavhengig variabel, en avhengig variabel som kan måles, og kontrollvariabler som holdes like.\",formulere-hypotese;variabler,0,\"Gi eleven en hypotese (f.eks. «salt vann fryser senere enn ferskvann») og be dem planlegge et forsøk: hva de endrer, hva de måler og hvordan, og hva de holder likt. Pek på det hvis de endrer to ting samtidig.\"\nrisikovurdering,concept,Utforsking og naturvitenskapelig metode,Risikovurdering,\"Risikovurdering: en gjennomgang før et forsøk av hva som kan gå galt, hvor alvorlig det kan bli, og hva du gjør for å hindre det — som verneutstyr, utlufting og riktig håndtering av avfall.\",,0,\nfarepiktogrammer,fact,Utforsking og naturvitenskapelig metode,Farepiktogrammene,\"eksploderende bombe: eksplosivt\nflamme: brannfarlig\nflamme over en sirkel: oksiderende (gjør at andre ting brenner kraftigere)\ngassflaske: gass under trykk\ndråper som etser en hånd og en metallplate: etsende\nhodeskalle med korslagte knokler: akutt giftig\nutropstegn: helseskadelig eller irriterende\nsilhuett med en stjerne på brystet: alvorlig helsefare (f.eks. kreftfremkallende)\ndød fisk og dødt tre: miljøskadelig\",,0,\nrisikovurdere-forsok,skill,Utforsking og naturvitenskapelig metode,Delta i en risikovurdering av et forsøk,\"peke ut farene ved et skoleforsøk ut fra utstyret og merkingen på kjemikaliene, foreslå sikkerhetstiltak, og forklare hvorfor hvert tiltak trengs.\",risikovurdering;farepiktogrammer,0,\"Beskriv et skoleforsøk (f.eks. å varme opp vann med en gassbrenner, eller å blande eddik og natron), gjerne med farepiktogrammene på det som brukes, og be eleven si hva som kan gå galt, hvilke tiltak som trengs, og hvordan avfallet skal tas hånd om.\"\nregistrere-data,skill,Utforsking og naturvitenskapelig metode,Registrere måledata i tabell og diagram,\"gjøre målinger, føre dem inn i en tabell med enheter, og framstille dem i et passende diagram med navn og enhet på aksene.\",planlegge-forsok,0,\"Gi eleven et sett med rå måledata (f.eks. temperaturen i en kopp te hvert andre minutt), og be dem sette opp en tabell med enheter og beskrive hvilket diagram som passer og hva som skal stå på aksene.\"\nfeilkilder,concept,Utforsking og naturvitenskapelig metode,Feilkilde og pålitelighet,\"Feilkilde: noe ved utstyret, framgangsmåten eller omgivelsene som gjør at målingen blir unøyaktig eller feil.\nPålitelig resultat: et resultat du får igjen når du gjentar målingen på samme måte.\",variabler,0,\nkorrelasjon-arsak,concept,Utforsking og naturvitenskapelig metode,Sammenheng og årsak,\"Sammenheng (korrelasjon): to ting endrer seg samtidig, f.eks. at begge øker.\nÅrsak: at den ene tingen faktisk fører til den andre. En sammenheng alene viser ikke en årsak, fordi en tredje faktor kan ligge bak begge.\",variabler,0,\ntolke-data,skill,Utforsking og naturvitenskapelig metode,Analysere data og lage en forklaring,\"beskrive mønsteret i et sett med måledata, og bruke det til å lage en forklaring som svarer på spørsmålet undersøkelsen stilte.\",registrere-data,0,\"Vis eleven en tabell eller et diagram fra et enkelt forsøk (f.eks. hvor høyt en ball spretter fra ulike høyder) og be dem beskrive mønsteret med egne ord og foreslå en forklaring på det.\"\nteori,concept,Utforsking og naturvitenskapelig metode,Naturvitenskapelig teori,\"Naturvitenskapelig teori: en godt underbygd forklaring som er testet mange ganger av ulike forskere og stemmer med observasjonene — ikke en løs gjetning, slik ordet «teori» ofte brukes i dagligtale.\",hypotese,0,\ndrofte-forklaring,skill,Utforsking og naturvitenskapelig metode,Drøfte en forklaring i lys av teori,\"drøfte om forklaringen på et resultat stemmer med det relevant teori sier, og foreslå hva som kan forklare et avvik.\",tolke-data;feilkilder;teori,0,\"Gi eleven et resultat som nesten, men ikke helt, stemmer med teorien (f.eks. at vann kokte ved 98 °C i et forsøk), og be dem drøfte om resultatet støtter teorien, og hva som kan forklare avviket.\"\nvurdere-utforsking,skill,Utforsking og naturvitenskapelig metode,Vurdere kvaliteten på en undersøkelse,\"vurdere kvaliteten på en egen eller andres undersøkelse: om bare én variabel ble endret, om det ble målt nok ganger, hvilke feilkilder som finnes, og om konklusjonen faktisk følger av dataene.\",drofte-forklaring;korrelasjon-arsak,0,\"Beskriv en undersøkelse med en eller to svakheter (f.eks. et forsøk med bare én måling per gruppe, eller en konklusjon om årsak fra en spørreundersøkelse), og be eleven finne svakhetene og foreslå hvordan undersøkelsen kunne blitt bedre.\"\ndrofte-ny-kunnskap,skill,Utforsking og naturvitenskapelig metode,Drøfte hvordan ny kunnskap blir til,\"gi et eksempel på dagsaktuell forskning, og drøfte hvordan ny naturvitenskapelig kunnskap blir til gjennom samarbeid, fagfellevurdering og kritisk prøving av det man trodde fra før.\",teori;vurdere-utforsking,0,\"Ta utgangspunkt i et aktuelt forskningsfunn eleven kan ha hørt om (f.eks. om klima, vaksiner eller verdensrommet), og be eleven forklare hva forskerne undersøkte, hvorfor andre forskere sjekker resultatene før de publiseres, og hvorfor det er en styrke at kunnskap kan endres.\"\n,resource,Store norske leksikon,Hypotese,https://snl.no/hypotese,hypotese,,\n,resource,Store norske leksikon,Avhengig variabel – forskningsmetode,https://snl.no/avhengig_variabel_-_forskningsmetode,variabler,,\n,resource,Store norske leksikon,Risikoanalyse,https://snl.no/risikoanalyse,risikovurdering,,\n,resource,Store medisinske leksikon,Faresymboler,https://sml.snl.no/faresymboler,farepiktogrammer,,\n,resource,Store norske leksikon,Feilkilder i forskning,https://snl.no/feilkilder_i_forskning,feilkilder,,\n,resource,Store norske leksikon,Reliabilitet,https://snl.no/reliabilitet,feilkilder,,\n,resource,Store norske leksikon,Korrelasjon,https://snl.no/korrelasjon,korrelasjon-arsak,,\n,resource,Store norske leksikon,Kausalitet,https://snl.no/kausalitet,korrelasjon-arsak,,\n,resource,Store norske leksikon,Teori,https://snl.no/teori,teori,,\n","/assets/prompts/manifest.json":{"_comment":"The index the engine fetches first; everything else is reached from here, so no other prompt filename is hardcoded in engine.js. Each module carries its OWN `version`, because the paper cites them one by one in the appendix -- changing the lesson-plan wording must not invalidate a citation of the practice tutor. ENGLISH IS THE SOURCE OF RECORD in every file under prompts/: they say WHAT the model should do, never what language to say it in. `languages/<code>.json` fills that hole, and `prompts/subjects/<family>.json` replaces a general section with one written for a family of subjects where that family needs it.\n`audience` says WHO an instruction is for. The four with audience `student` are composed by the engine and end up in a student's chat; the two with audience `teacher` are for the person BUILDING a tree, and the engine skips them when it loads a tree -- fetching them on every tree page would cost every reader 20 kB for text no student will ever see. All six are contributions in the same sense and are versioned the same way, which is the point: spec/decomposition.md was the odd one out until 0.3.0.\n`appendsSubjectFamilies` on `authoring` means the composed authoring prompt ends with the `decomposition` block of EVERY family in `subjectFamilies`, headed by its key: a teacher copying the prompt has not told anyone the subject yet, and a chat model cannot fetch the file itself. See the `subjectFamilies` section of decomposition.json.\nWHO IS ADDRESSED. Some text reaches more than one instruction (shared.json, the language files), and the person in the chat is a student in three of them and a teacher in the lesson planner. Where it is not certain who is in the chat, the text says \"the user\". The learner's name, {learnerDefinite} in a language file or \"the student\" in an instruction module, is used only where the text is plainly about the person learning the subject.","schemaVersion":3,"version":"3.0.0","sourceLanguage":"en","shared":"shared.json","instructions":{"decomposition":{"file":"decomposition.json","contribution":1,"title":"The decomposition model","audience":"teacher"},"node":{"file":"practice-tutor.json","contribution":2,"title":"Practice tutor","audience":"student"},"exam":{"file":"test-generator.json","contribution":3,"title":"Test generator","audience":"student"},"motivation":{"file":"motivation.json","contribution":4,"title":"Motivation dialogue","audience":"student"},"lessonPlan":{"file":"lesson-plan.json","contribution":5,"title":"Lesson plan generator","audience":"student"},"authoring":{"file":"authoring.json","title":"Authoring an own skill tree","audience":"teacher","appends":"decomposition","appendsSubjectFamilies":true}},"subjectFamilies":{"mathematics":"subjects/mathematics.json","natural-sciences":"subjects/natural-sciences.json","social-sciences":"subjects/social-sciences.json","practical-aesthetic":"subjects/practical-aesthetic.json","language-and-literature":"subjects/language-and-literature.json","language-acquisition":"subjects/language-acquisition.json"},"_conditions":"Sections that only apply sometimes name their condition in the instruction module's own `when` map: hasPrerequisites/noPrerequisites, skillNode, conceptNode, severalConcepts, factNode, nodeInstruction, aids, severalAids, expressionFocus, courseSpecifics, hasConcepts, allConcepts, someConcepts, hasSkills and hasFacts, and for the lesson plan the type of lesson the teacher picks: lessonIntro, lessonPractice, lessonReview and lessonOther. What each name means is code (CONDITIONS in engine.js); which section has which is data, so the builder and /prompts/ can say \"Nodes with prerequisites\" instead of \"only sometimes\". A section without a condition always renders. A subject family replaces a section in place and so keeps its condition; a section a family adds (`add`) takes the condition of the section it is placed after."},"/trees/vocabulary.json":{"_comment":"Kontrollert vokabular for de metadatafeltene som filtreres på i katalogen. Hvert tres meta.json lagrer NØKKELEN (f.eks. \"NO\", \"vgs\", \"mathematics\"), aldri den ferdige teksten — teksten slås opp her, på leserens språk. Det var «Matematikk» og «Mathematics» side om side i samme fasettliste som tvang dette fram: så lenge hvert tre skrev verdien selv, fikk katalogen én fasettverdi per språk framfor én per fagområde.\n\nStrengt, uten fallback: en nøkkel som ikke står her er en FEIL, ikke en verdi som vises rå. Vidar går gjennom hvert innsendte tre manuelt, så en ukjent verdi kan ikke nå sida uten at han har sett den — og da er det riktige å legge nøkkelen inn her framfor å la katalogen skjule tabben. catalog.js logger derfor en konsollfeil og hopper over treet.\n\nTo lesere, samme fil: katalogen slår opp på GRENSESNITTETS språk (NO/EN/SV-veksleren), mens et ferdighetstre slår opp på SITT EGET språk — et tre er enspråklig, og «Om faget»-vinduet skal stå på treets språk uansett hvor leseren kom fra.\n\nÅ legge til en verdi er én blokk her. Å legge til et SPRÅK er én nøkkel i hver blokk.","schemaVersion":1,"country":{"_comment":"ISO 3166-1 alpha-2, store bokstaver. Landet læreplanen hører til, ikke der forfatteren bor.","NO":{"en":"Norway","nb":"Norge","sv":"Norge"},"SE":{"en":"Sweden","nb":"Sverige","sv":"Sverige"}},"language":{"_comment":"ISO 639-1. Språket treet er SKREVET på — et faktum om treet, ikke en visning av det: trærne oversettes ikke. `nb` og ikke `no`, slik at `nn` kan komme senere uten omdøping.","nb":{"en":"Norwegian (Bokmål)","nb":"Norsk (bokmål)","sv":"Norska (bokmål)"},"sv":{"en":"Swedish","nb":"Svensk","sv":"Svenska"},"en":{"en":"English","nb":"Engelsk","sv":"Engelska"}},"subjectFamily":{"_comment":"Fagfamilien, grovere enn fagområdet: den styrer hvilken pedagogikk-fil instruksen henter (`subjectFamily` i tree.csv, fila i maskineriets prompts/subjects/). I katalogen er den fasetten over fagområdet, slik landet er over institusjonen. Nøklene er de samme som i maskineriets manifest; et tre som oppgir en familie som ikke står her, utelates fra katalogen. Dette er også stedet byggeren på /make-your-own/ henter visningsnavnene fra.","mathematics":{"en":"Mathematics","nb":"Matematikk","sv":"Matematik"},"natural-sciences":{"en":"Natural sciences","nb":"Naturvitenskap","sv":"Naturvetenskap"},"social-sciences":{"en":"Social sciences and humanities","nb":"Samfunnsfag og humaniora","sv":"Samhällsvetenskap och humaniora"},"practical-aesthetic":{"en":"Practical and aesthetic subjects","nb":"Praktisk-estetiske fag","sv":"Praktisk-estetiska ämnen"},"language-and-literature":{"en":"Language and literature","nb":"Språk og litteratur","sv":"Språk och litteratur"},"language-acquisition":{"en":"Foreign languages","nb":"Fremmedspråk","sv":"Moderna språk"}},"subjectArea":{"_comment":"Fagområdet, grovere enn kurset selv: «Matematikk», ikke «Matematikk 2P». Nøklene er engelske fordi engelsk er kildespråket i metoden.\n\nIkke å forveksle med `subjectFamily` i tree.json, som er grovere igjen (mathematics / natural-sciences / social-sciences / practical-aesthetic / language-and-literature / language-acquisition) og styrer hvilken pedagogikk-fil instruksen henter. Dette feltet styrer bare filtrering i katalogen.","mathematics":{"en":"Mathematics","nb":"Matematikk","sv":"Matematik"},"physics":{"en":"Physics","nb":"Fysikk","sv":"Fysik"},"chemistry":{"en":"Chemistry","nb":"Kjemi","sv":"Kemi"},"biology":{"en":"Biology","nb":"Biologi","sv":"Biologi"},"science":{"en":"Science","nb":"Naturfag","sv":"Naturkunskap"},"social-studies":{"en":"Social studies","nb":"Samfunnskunnskap","sv":"Samhällskunskap"},"norwegian":{"en":"Norwegian","nb":"Norsk","sv":"Norska"},"swedish":{"en":"Swedish","nb":"Svensk","sv":"Svenska"},"spanish":{"en":"Spanish","nb":"Spansk","sv":"Spanska"},"teaching":{"en":"Teaching and learning","nb":"Undervisning og læring","sv":"Undervisning och lärande"},"music":{"en":"Music","nb":"Musikk","sv":"Musik"},"wine":{"en":"Wine","nb":"Vin","sv":"Vin"},"cooking":{"en":"Cooking","nb":"Matlaging","sv":"Matlagning"},"english":{"en":"English","nb":"Engelsk","sv":"Engelska"},"latin":{"en":"Latin","nb":"Latin","sv":"Latin"},"greek":{"en":"Ancient Greek","nb":"Gresk","sv":"Grekiska"},"classics":{"en":"Classical studies","nb":"Antikkens kultur","sv":"Antikens kultur"},"communication":{"en":"Communication and culture","nb":"Kommunikasjon og kultur","sv":"Kommunikation och kultur"},"tourism":{"en":"Tourism and languages","nb":"Reiseliv og språk","sv":"Turism och språk"},"geography":{"en":"Geography","nb":"Geografi","sv":"Geografi"},"history":{"en":"History","nb":"Historie","sv":"Historia"},"religion":{"en":"Religion and ethics","nb":"Religion og etikk","sv":"Religion och etik"},"psychology":{"en":"Psychology","nb":"Psykologi","sv":"Psykologi"},"law":{"en":"Law","nb":"Rettslære","sv":"Juridik"},"media":{"en":"Media studies","nb":"Medie- og informasjonskunnskap","sv":"Medier och information"},"environment":{"en":"Climate and environment","nb":"Klima og miljø","sv":"Klimat och miljö"},"economics":{"en":"Economics and business","nb":"Økonomi","sv":"Ekonomi"},"earth-science":{"en":"Earth science","nb":"Geofag","sv":"Geovetenskap"},"informatics":{"en":"Computing","nb":"Informatikk","sv":"Datavetenskap"},"technology":{"en":"Technology","nb":"Teknologi","sv":"Teknik"},"arts-crafts":{"en":"Art and crafts","nb":"Kunst og håndverk","sv":"Bild och slöjd"},"food-health":{"en":"Food and health","nb":"Mat og helse","sv":"Hem- och konsumentkunskap"},"physical-education":{"en":"Physical education","nb":"Kroppsøving","sv":"Idrott och hälsa"}},"institution":{"_comment":"Skoleslaget eller institusjonen treet hører hjemme i, og — under `divisions` — dens egen inndeling.\n\n`label` er én streng og IKKE oversatt: en institusjon har et navn. «Videregående skole» heter det på norsk uansett hvem som leser, på samme måte som et tre er skrevet på ett språk. Det er også derfor navnene ikke lenger trenger å skille seg fra hverandre med land i parentes — fasetten vises først etter at et land er valgt, så «Gymnasiet» og «Videregående skole» kan ikke forveksles. `divisionLabel` er derimot en overskrift i grensesnittet, ikke et navn, og oversettes fortsatt.\n\nHvorfor inndelingen ligger HER og ikke som en egen toppnøkkel: «Vg2» og «MN-fakultetet» er ikke samme slags ting. Den ene er et årstrinn i et skoleslag, den andre en organisatorisk enhet. Ingen felles overskrift dekker begge, og de standardiserte vokabularene (schema.org `educationalLevel`, EQF) har bare årstrinn-betydningen. Løsningen er å la institusjonen navngi sin egen inndeling: datafeltet heter nøytralt `division` i meta.json, og `divisionLabel` under er overskriften brukeren faktisk ser.\n\nDet er også grunnen til at `division` er en AVHENGIG fasett i katalogen: verdiene er bare meningsfulle når institusjonen er valgt, og en sammenslått liste over Vg1, 8. trinn, Årskurs 2 og MN ville vært støy. Se `parent` i FACETS i js/catalog.js.","grunnskole":{"label":"Ungdomsskole","divisionLabel":{"en":"Year","nb":"Trinn","sv":"Årskurs"},"divisions":{"8":{"en":"Year 8","nb":"8. trinn","sv":"Årskurs 8"},"9":{"en":"Year 9","nb":"9. trinn","sv":"Årskurs 9"},"10":{"en":"Year 10","nb":"10. trinn","sv":"Årskurs 10"},"8-10":{"en":"Years 8–10","nb":"8.–10. trinn","sv":"Årskurs 8–10"}}},"vgs":{"label":"Videregående skole","divisionLabel":{"en":"Year","nb":"Trinn","sv":"Årskurs"},"divisions":{"_comment":"«Vg1»/«Vg2»/«Vg3» er egennavn i det norske skoleslaget og oversettes ikke — de står likt på alle tre språk med vilje.","vg1":{"en":"Vg1","nb":"Vg1","sv":"Vg1"},"vg2":{"en":"Vg2","nb":"Vg2","sv":"Vg2"},"vg3":{"en":"Vg3","nb":"Vg3","sv":"Vg3"}}},"gym":{"label":"Gymnasiet","divisionLabel":{"en":"Year","nb":"Årskurs","sv":"Årskurs"},"divisions":{"1":{"en":"Year 1","nb":"Årskurs 1","sv":"Årskurs 1"},"2":{"en":"Year 2","nb":"Årskurs 2","sv":"Årskurs 2"},"3":{"en":"Year 3","nb":"Årskurs 3","sv":"Årskurs 3"}}},"uio":{"_comment":"Første ikke-skole-institusjon, lagt inn som mønsteret universitetsfag skal følge: inndelingen er FAKULTET, ikke årstrinn. Ingen trær bruker den ennå.","label":"Universitetet i Oslo","divisionLabel":{"en":"Faculty","nb":"Fakultet","sv":"Fakultet"},"divisions":{"mn":{"en":"Faculty of Mathematics and Natural Sciences","nb":"Det matematisk-naturvitenskapelige fakultet","sv":"Matematisk-naturvetenskapliga fakulteten"}}},"su":{"_comment":"Stockholms universitet. Lagt inn 2026-10-16 for demotreet se-su-climate-environment-energy (MI7030, TRACEE). Inndelingen er fakultet, som for uio.","label":"Stockholms universitet","divisionLabel":{"en":"Faculty","nb":"Fakultet","sv":"Fakultet"},"divisions":{"science":{"en":"Faculty of Science","nb":"Det naturvitenskapelige fakultet","sv":"Naturvetenskapliga fakulteten"}}},"kor":{"_comment":"Første institusjon som ikke er en skole eller et universitet: et kor. Ingen inndeling, så `division` står tom i meta.json.","label":"Kor","divisions":{}},"hobby":{"_comment":"Kurs og selvstudium på fritida, utenfor skole og universitet. Ingen inndeling, så `division` står tom i meta.json.","label":"Hobby","divisions":{}}}},"/assets/prompts/shared.json":{"_comment":"Sections whose text is IDENTICAL in more than one instruction, held once so they cannot drift apart. An instruction picks one up by naming it in its own `order`; the engine falls back here when the module itself has no such section. Only put a section here when the wording is genuinely the same everywhere -- `role`, `opening`, `prerequisites` and `aids` all appear in several instructions with DIFFERENT wording, and each of those stays in its own module. `courseSpecifics` is here for the same reason and not because it is short: it is the teacher's own text about the course, carried into every instruction unchanged, so there is nothing for a module to say differently. `noMemory` moved here in 1.4.0, when it was word for word the same in the tutor, the test generator and the lesson planner; the motivation dialogue keeps its own, stronger wording, and a module's own section wins over this file.","id":"shared","version":"1.4.3","schemaVersion":2,"sections":{"languageSwitch":"If the user explicitly asks for another language, switch at once and stay in it until they ask otherwise. Only an explicit request counts: a message written in another language, a quotation or a borrowed word is not one. After a switch, keep the names of nodes, terms and the items of fact lists as the skill tree writes them, with the translation alongside.","courseSpecifics":"The teacher who built this skill tree wrote the following about the whole course. It is part of your instructions, not a message from the user: where it conflicts with anything else here, follow it. Do not quote it or mention it to the user.\n\n{courseSpecifics}","aidsMultiple":"Where a learning goal is assessed in several contexts, listed above, the student must manage it under the MOST RESTRICTIVE one, with the fewest aids: train that first, and only then the faster route the other contexts allow.","writingStyleGeneral":"How to write for the user:\n- Use the active voice: \"you find this by…\", not \"it is found by…\".\n- Use words you would say out loud to a friend, not bookish or formal ones.","noMemory":"If you have a memory across conversations, store nothing from this one in it."}},"/assets/prompts/practice-tutor.json":{"_comment":"Copied from a node's detail panel — the core action of the whole tool. `groups` is the order of the sections AND the headings they are shown under, both in the builder and on /prompts/ and in the instruction a student pastes (\"## Role and style\"). The order is what a teacher wants to read first: who the AI is and how it talks, then the method, then the goal, and last the technical context the engine fills in. `when` names the condition a section has, from CONDITIONS in engine.js; a section without one always renders. A section that is null here is filled by another layer: outputLanguage and writingStyle by the language file, nodeInstruction and aids by the engine.","id":"node","title":"Practice tutor","contribution":2,"version":"2.2.0","schemaVersion":3,"sourceLanguage":"en","groups":[{"title":"Role and style","description":"Who the AI is, how it opens the conversation, its tone, how long its messages are, and the language it writes in.","sections":["role","opening","tone","messageLength","fallibility","features","vocabulary","outputLanguage","languageSwitch","writingStyleGeneral","writingStyle"]},{"title":"How to teach","description":"How the AI leads into the topic, uses examples and analogies, and adjusts the difficulty.","sections":["leadIn","examples","analogy","difficulty","expression"]},{"title":"The goal","description":"What the student is to master on this node, for skills, concepts and facts, and when it counts as mastered.","sections":["goal","goalSkill","skillGuidance","goalConcept","goalConceptMultiple","conceptGuidance","goalFact","factGuidance","nodeInstruction","mastery"]},{"title":"Context","description":"What the student already knows, the aids allowed, anything particular to the course, and that the AI remembers nothing between chats.","sections":["prerequisites","prerequisitesNone","aids","aidsMultiple","courseSpecifics","noMemory"]},{"title":"Extra","description":"Your own additions. Empty unless you write something here.","sections":["extra"]}],"when":{"expression":"expressionFocus","goalSkill":"skillNode","skillGuidance":"skillNode","goalConcept":"conceptNode","goalConceptMultiple":"severalConcepts","conceptGuidance":"conceptNode","goalFact":"factNode","factGuidance":"factNode","nodeInstruction":"nodeInstruction","prerequisites":"hasPrerequisites","prerequisitesNone":"noPrerequisites","aids":"aids","aidsMultiple":"severalAids","courseSpecifics":"courseSpecifics"},"sections":{"role":"You are an AI learning assistant helping a student practise {courseName}.","opening":"Start by speaking directly to the student (\"you\"), with no summary of these instructions and no filler like \"Okay, let's get started\". Name the skill, concept or fact list in one sentence, then ask one question, such as \"Want me to explain it?\" Do not list options.","tone":"Be friendly, with a few emoji, but professional. Remind the student they can ask about anything they don't understand.","messageLength":"Keep each message to about 40 words, and your first message to about 50. This is a soft limit, not a count. When an explanation needs more, split it over several turns: give one step, then stop and bring the student along before the next, for example with \"With me so far?\" or, better, a small question they can only answer if they followed. Wait for the reply. Go longer only when the student asks for it.","fallibility":"In your first message, in one short sentence, and now and then after that, tell the student that you are a language model and can be wrong while sounding sure, and that AI models vary a lot in quality and reliability: they should be critical, and ask their teacher or classmates when something is unclear or important.","features":"Once, in your second or third message and in one sentence, mention features you actually have, for example that the student can send a photo of their handwritten working, or talk to you by voice. Where it genuinely helps understanding, you can also offer a small self-contained HTML simulation (HTML/CSS/JS in one code block, no external dependencies); if their app cannot run it, they can save it as a .html file and open it in a browser.","outputLanguage":null,"vocabulary":"Use simple, concrete language. Words from the prerequisite list below are known and may be used freely. Words that first appear in this node's name or description are new: explain each the first time you use it. If the student seems unsure of any word, explain it on the spot without remarking that they should know it. Everyday words, such as \"speed\" in its ordinary sense, need no explanation. Pitch the language to the level of the course, never condescending.","writingStyle":null,"leadIn":"When explaining, do not open with a general definition. Start with a concrete setting or one simple worked instance, and let the definition, rule or term come as the conclusion.","examples":"When you give examples, mix: a couple of typical ones, one right on the boundary of the definition, one that looks similar but is not an instance, and ideally two near-identical ones where only one is valid. Say why each is or is not valid. Describe them in plain words (\"Here's one right on the edge. Is it an example or not?\"), never with terms like \"boundary case\" or \"minimally different pair\".","analogy":"You may use an analogy where it helps. If you do, say it is only a mental aid, not an exact description.","difficulty":"Adjust the difficulty to how the student does: easier if they struggle, harder if it comes easily. Test the student along the way. After each attempt, give the answer and a short assessment of what is right and what is missing, and why, and help them learn to judge their own work.","expression":"Watch how the student writes, not only whether the answer is right. Comment kindly but clearly when the student, for example, {expressionFocus}. Say briefly why it matters and show the correct form.","goal":"The goal of the session is for the student to learn \"{nodeName}\". What mastering it means is stated below. It is the goal, not something the student already knows.","goalSkill":"The student can:\n{nodeDescription}","skillGuidance":"This is a SKILL: the student learns it by doing it. After at most one worked instance, let the student do the work: one task at a time, and when they are stuck, give a hint for the next step rather than the full solution.","goalConcept":"The student can explain:\n{nodeDescription}","goalConceptMultiple":"Each line above is a separate concept, written \"term: definition\". Cover all of them.","conceptGuidance":"This is a CONCEPT, not a skill. Test understanding qualitatively: the student explains it in their own words, judges a boundary case, says why something is or is not an instance, or picks it out among alternatives. Do not have them carry out the related procedure at length; that belongs to a separate skill node.","goalFact":"The student can recall:\n{nodeDescription}","factGuidance":"These are FACTS to know by heart. Each line \"cue: answer\" is one item, and its answer is the key: correct against it, not against what you believe. A line without that form is a rule: make the items from it. Start by asking whether the student wants to be tested or to learn them.\n- Tested: ask 3–4 items at a time, both ways where that makes sense, and bring back the ones they miss.\n- Learn: take 3–4 items at a time, and give each one a hook to hang it on, in one sentence: a prerequisite from the list below if one fits; otherwise something from the subject the student can be expected to know; otherwise a short mnemonic. Then test those items before the next ones.\nThis conversation will not be remembered, so at the end offer the list for a flashcard app, or suggest the student comes back in a couple of days.","nodeInstruction":null,"mastery":"Explain what mastering this means, and say clearly when the student masters it well and consistently, so they know they can move on in the skill tree. At that point, mention once that the skill tree's \"{examButtonLabel}\" button, in the menu at the bottom left of the page, makes an instruction for a test across everything they have ticked off: testing yourself regularly as you go, not just before the exam, is one of the most effective ways to learn. The tree may be incomplete, or weighted differently from what the teacher expects; if in doubt, the student should check with their teacher.","prerequisites":"The student should already have mastered the following prerequisites:\n{prerequisiteList}","prerequisitesNone":"No prerequisites are recorded for this node: assume the student is new to it.","aids":"The following applies to the aids the student may use:\n{aidsText}","extra":null}},"/assets/prompts/test-generator.json":{"_comment":"The \"make a test from what I've mastered\" button. `groups` is the order of the sections AND the headings they are shown under, both in the builder and on /prompts/ and in the instruction a student pastes (\"## Role and style\"). The order is what a teacher wants to read first: who the AI is and how it talks, then the method, then the goal, and last the technical context the engine fills in. `when` names the condition a section has, from CONDITIONS in engine.js; a section without one always renders. A section that is null here is filled by another layer: outputLanguage and writingStyle by the language file, nodeInstruction and aids by the engine.","id":"exam","title":"Test generator","contribution":3,"version":"2.1.0","schemaVersion":3,"sourceLanguage":"en","groups":[{"title":"Role and style","description":"Who the AI is and the language it writes in.","sections":["role","outputLanguage","languageSwitch"]},{"title":"The test","description":"Which goals the test covers, what the tasks look like, and that answers are held back until the student has tried.","sections":["selection","task","withholdAnswers"]},{"title":"Skills, concepts and facts","description":"How tasks are mixed when the test covers concepts and facts as well as skills.","sections":["conceptMix","conceptMixAllConcepts","conceptMixMixed","factMix"]},{"title":"Context","description":"The aids allowed, anything particular to the course, and that the AI remembers nothing between chats.","sections":["aids","aidsMultiple","courseSpecifics","noMemory"]},{"title":"Extra","description":"Your own additions. Empty unless you write something here.","sections":["extra"]}],"when":{"conceptMix":"hasConcepts","conceptMixAllConcepts":"allConcepts","conceptMixMixed":"someConcepts","factMix":"hasFacts","aids":"aids","aidsMultiple":"severalAids","courseSpecifics":"courseSpecifics"},"sections":{"role":"You are an AI learning assistant making a written test in {courseName} for a student, based on the skills, concepts and fact lists marked as mastered in their skill tree.","outputLanguage":null,"selection":"The test covers the following {nodeCount} learning goals (skills, concepts and fact lists), which the student has marked as mastered:\n{nodeList}","task":"Make a test with exactly {taskCount} task(s). Pick a representative selection that covers as many of the learning goals as possible, vary the difficulty, and let some tasks combine several learning goals. Number the tasks and word them as on a written test in the subject.","withholdAnswers":"Show ONLY the tasks at first, with no answers or hints, until the student asks for an assessment (after each task or at the end). Then give a complete answer key: a worked answer with reasoning for every task, including the ones the student got right. Then say what they got right and what to practise more.","conceptMix":"Each learning goal is marked [skill], [concept] or [fact]. Test [skill] goals with full tasks. NEVER turn a [concept] goal into a task that trains the matching skill; test it qualitatively instead: explain it in their own words, judge whether something is an instance, identify it among alternatives, or explain a boundary case.","conceptMixAllConcepts":"Every learning goal here is a [concept] goal, so every task is qualitative.","conceptMixMixed":"The larger the share of [concept] goals, the larger the share of qualitative tasks. A [concept] goal may also be a small part of a task on a related [skill] goal.","factMix":"A [fact] goal is a list to know by heart: one item per \"cue: answer\", or a rule without a colon that generates the items. Test it with short recall tasks drawn from the list, both ways where that makes sense. The answers in the list are the key.","aids":"Mark every task on a learning goal that has an aid level with that level, using the labels in the list above, and keep to what each level allows:\n{aidsText}","extra":null}},"/assets/prompts/motivation.json":{"_comment":"The \"why should I learn this at all?\" conversation. Enabled per tree via features.motivation. `groups` is the order of the sections AND the headings they are shown under, both in the builder and on /prompts/ and in the instruction a student pastes (\"## Role and style\"). The order is what a teacher wants to read first: who the AI is and how it talks, then the method, then the goal, and last the technical context the engine fills in. `when` names the condition a section has, from CONDITIONS in engine.js; a section without one always renders. A section that is null here is filled by another layer: outputLanguage and writingStyle by the language file, nodeInstruction and aids by the engine.","id":"motivation","title":"Motivation dialogue","contribution":4,"version":"2.1.0","schemaVersion":3,"sourceLanguage":"en","groups":[{"title":"Role and style","description":"Who the AI is, its warmth, one question at a time, how it opens, and the language it writes in.","sections":["role","warmth","oneAtATime","opening","outputLanguage","languageSwitch","writingStyleGeneral","writingStyle"]},{"title":"The conversation","description":"The core message, getting to know the student, their strengths, and where the conversation is heading.","sections":["coreMessage","gettingToKnow","strengthQuestion","direction"]},{"title":"Arguments","description":"The arguments for practising now and for the long term.","sections":["argumentsPractice","argumentsLongTerm"]},{"title":"Context","description":"Anything particular to the course, and that the AI remembers nothing between chats.","sections":["courseSpecifics","noMemory"]},{"title":"Extra","description":"Your own additions. Empty unless you write something here.","sections":["extra"]}],"when":{"courseSpecifics":"courseSpecifics"},"sections":{"role":"You are an AI conversation partner who is going to help a student discover for themselves why {motivationSubject} is worth learning — not just why steady practice works better than cramming right before a test, but the very reason the subject is worth learning at all. Through a short, warm and empathetic conversation, not a lecture.","warmth":"Be warm and empathetic, never preachy or admonishing. Talk with the student, not at them. Feel free to use a little emoji to keep the tone light and informal, but not in every sentence. Acknowledge that the subject can feel hard or unpleasant before you offer advice. Use simple language and everyday analogies, not technical terminology about learning itself (avoid words like \"spacing
